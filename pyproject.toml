[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quatm-core"
version = "1.0.1"
description = "AGPL-3.0 core runtime for the Quatm experiment control framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GNU Affero General Public License v3 (AGPL-3.0)" }
authors = [{ name = "Quatm Team" }]
keywords = ["quantum", "experiment", "control", "acquisition", "agpl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyside6>=6.5",
    "numpy",
    "pyzmq>=26",
    "pyqtgraph",
    "termcolor",
    "h5py",
    "psutil",
    "scipy",
    "uncertainties",
    "pytz",
    "pyserial",
    "requests",
    "python-dateutil",
    "tqdm",
    "matplotlib",
    "pandas",
    "cryptography",
    "cython",
]

[project.scripts]
quatm-driver-diagnose = "quatm.utils.driver_diagnose:main"

[project.urls]
Homepage = "https://quatm.com/"
Documentation = "https://quatm.com/en/docs/"
Repository = "https://github.com/quatm-team/quatm-core"
Issues = "https://github.com/quatm-team/quatm-core/issues"
Changelog = "https://github.com/quatm-team/quatm-core/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = { find = { include = ["quatm", "quatm.*"] } }
license-files = ["LICENSE", "AGPL-3.0.txt", "NOTICE", "THIRD_PARTY_LICENSES"]

[tool.setuptools.package-data]
quatm = [
    "requirements.txt",
    "experiment/LICENSE",
    "physics/LICENSE",
    "servers/LICENSE",
    "utils/LICENSE",
    "locale/*.json",
    "physics/tiamo/verdi_cals/*.txt",
]
